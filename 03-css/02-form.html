<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="form-page">
    <main class="form-container">
      <h1 class="main-heading-form">Roth IRA Calculator</h1>

      <form class="ira-form" action="/submitform">
        <div class="form-element">
          <label class="form-label" for="Balance"> Balance ($) </label>
          <input class="form-input" type="text" name="Balance" id="Balance" />
        </div>

        <div class="form-element">
          <label class="form-label" for="annual">
            Annual contribution ($)
          </label>
          <input class="form-input" type="text" name="annual" id="annual" />
        </div>

        <div class="form-element">
          <fieldset>
            <legend class="form-legend">Maximize contributions?</legend>

            <div class="form-radios">
              <input type="radio" name="maximize" id="yes" value="yes" />
              <label class="form-label-radio" for="yes"> Yes </label>

              <input type="radio" name="maximize" id="no" value="no" />
              <label class="form-label-radio" for="no"> No </label>
            </div>
          </fieldset>
        </div>

        <div class="form-element">
          <label class="form-label" for="rate">
            Expected rate of return (%)
          </label>
          <input
            class="form-input"
            type="number"
            name="rate"
            id="rate"
            step="0.01"
          />
        </div>

        <div class="form-element">
          <label class="form-label" for="current"> Current Age </label>
          <input class="form-input" type="number" name="current" id="current" />
        </div>

        <div class="form-element">
          <label class="form-label" for="retire"> Retirement Age </label>
          <input class="form-input" type="number" name="retire" id="retire" />
        </div>

        <div class="form-element">
          <label class="form-label" for="taxrate">
            Marginal Tax Rate (%)
          </label>
          <input
            class="form-input"
            type="number"
            name="taxrate"
            id="taxrate"
            step="0.01"
          />
        </div>

        <div class="form-element form-buttons">
          <input class="btn btn-submit" type="submit" value="Calculate" />
          <input class="btn btn-reset" type="reset" value="Reset" />
        </div>
      </form>

      <p class="form-note">
        This exercise is a simplified version of the Roth IRA Calculator at
        <a href="https://www.calculator.net"> Calculator.net </a>.
      </p>
    </main>
  </body>
</html>
